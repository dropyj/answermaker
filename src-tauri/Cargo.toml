[package]
name = "answermaker"
version = "0.2.0"
description = "AnswerMaker - local AI hub: vault, RAG knowledge base, MCP/CLI gateway, chat"
authors = ["AnswerMaker"]
edition = "2021"

[lib]
name = "answermaker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 本地数据库（WAL）；bundled 自带 SQLite，无需系统依赖
rusqlite = { version = "0.32", features = ["bundled"] }
# 保险库加密（V0.2 接真实实现；V0.1 仅结构与接口，见 vault_crypto.rs）
argon2 = "0.5"
aes-gcm = "0.10"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
base64 = "0.22"
